<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IronLedger — Sign In</title>
  <meta name="description" content="Sign in to IronLedger — your secure financial ledger platform." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="login.css" />
</head>
<body>

  <!-- Animated grid background -->
  <div class="grid-overlay" aria-hidden="true"></div>

  <!-- ── Login Card ─────────────────────────────────────────────── -->
  <main class="card" role="main" aria-label="Sign In Form">

    <!-- Logo -->
    <div class="logo-wrap">
      <div class="logo-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2 L2 7 L12 12 L22 7 Z"/>
          <path d="M2 17 L12 22 L22 17"/>
          <path d="M2 12 L12 17 L22 12"/>
        </svg>
      </div>
      <span class="logo-name">IronLedger</span>
    </div>

    <h1 class="card-title">Welcome back</h1>
    <p class="card-subtitle">Sign in to continue to your dashboard</p>

    <!-- ── Form ─────────────────────────────────────────────────── -->
    <form id="loginForm" novalidate autocomplete="off">

      <!-- Username Field -->
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <div class="input-wrap">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <input
            type="text"
            id="username"
            name="username"
            class="form-input"
            placeholder="e.g. john_doe"
            aria-required="true"
            aria-describedby="username-msg"
            autocomplete="username"
          />
        </div>
        <!-- Error / success message for username -->
        <div class="field-msg" id="username-msg" role="alert" aria-live="polite"></div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrap">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="Min. 8 characters"
            aria-required="true"
            aria-describedby="password-msg"
            autocomplete="current-password"
          />
          <!-- Show / Hide password toggle -->
          <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">
            <!-- Eye (password hidden) -->
            <svg id="eyeShow" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <!-- Eye-off (password visible) -->
            <svg id="eyeHide" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8
                       a18.45 18.45 0 0 1 5.06-5.94
                       M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8
                       a18.5 18.5 0 0 1-2.16 3.19
                       m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>

        <!-- 4-segment password strength bar -->
        <div class="strength-bar-wrap" id="strengthBar" aria-hidden="true">
          <div class="strength-seg" id="seg1"></div>
          <div class="strength-seg" id="seg2"></div>
          <div class="strength-seg" id="seg3"></div>
          <div class="strength-seg" id="seg4"></div>
        </div>

        <!-- Error / success message for password -->
        <div class="field-msg" id="password-msg" role="alert" aria-live="polite"></div>
      </div>

      <!-- Sign In Button -->
      <button type="submit" class="btn-login" id="loginBtn">
        <span class="btn-text">Sign In</span>
        <div class="spinner" aria-hidden="true"></div>
      </button>

      <!-- Success Banner (shown after validation passes) -->
      <div class="success-banner" id="successBanner" role="status" aria-live="polite">
        <div class="success-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <div class="success-text-wrap">
          <div class="success-title">Login Successful!</div>
          <div class="success-sub">Redirecting to your dashboard…</div>
        </div>
      </div>

    </form>
    <!-- ── End Form ──────────────────────────────────────────────── -->

    <p class="card-footer">
      Don't have an account? <a href="#" id="signupLink">Create one</a>
    </p>

  </main>
  <!-- ── End Card ─────────────────────────────────────────────────── -->

  <!-- JavaScript (loaded after DOM) -->
  <script src="login.js"></script>
</body>
</html>
